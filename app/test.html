<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSTEP Test</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Full-screen shell ── */
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    .app-header { flex-shrink: 0; }
    .footer-nav { flex-shrink: 0; }

    /* #main-content fills remaining space; sections are stacked absolutely inside */
    #main-content {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    /* All sections share the same slot; only .active is shown */
    .section {
      display: none;
      position: absolute;
      inset: 0;              /* top:0 right:0 bottom:0 left:0 */
      flex-direction: column;
      overflow: hidden;
    }
    .section.active { display: flex; }

    /* ── Listening ── */
    #section-listening .listening-questions { flex: 1; overflow-y: auto; min-height: 0; }

    /* ── Reading: split-view layout ── */
    #section-reading {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Passage navigator bar — sticky at top of reading section */
    .read-q-nav-sticky {
      flex-shrink: 0;
      background: var(--card); border-bottom: 1px solid var(--border);
    }

    /* Split body: passage left | questions right */
    .read-split {
      flex: 1; min-height: 0;
      display: flex;
      overflow: hidden;
    }

    /* Left: passage */
    .read-passage-block {
      flex: 1; min-width: 0;
      overflow-y: auto;
      padding: 1.5rem 2rem; font-size: .95rem; line-height: 1.9;
      border-right: 2px solid var(--border);
      background: var(--card);
      box-sizing: border-box;
    }
    .read-passage-block h3 { color: var(--primary); margin-bottom: .85rem; font-size: 1.05rem; }
    .read-passage-block p  { margin-bottom: .65rem; }

    /* Right: all questions for passage */
    .read-q-block {
      flex: 1; min-width: 0;
      overflow-y: auto;
      padding: .75rem 1.5rem;
      box-sizing: border-box;
    }
    .read-q-block .question-area { max-width: none; padding: 0; }

    /* Individual question card in the right panel */
    .read-q-item {
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }
    .read-q-item:last-child { border-bottom: none; }
    .read-q-item .options { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: .5rem; }

    @media (max-width: 768px) {
      .read-split { flex-direction: column; }
      .read-passage-block { border-right: none; border-bottom: 2px solid var(--border); max-height: 45vh; }
      .read-q-item .options { grid-template-columns: 1fr; }
      .read-passage-block, .read-q-block { padding: 1rem; }
    }

    /* ── Listening: all questions in one scroll ── */
    .listen-q-block {
      padding: 1.1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .listen-q-block:last-child { border-bottom: none; }

    /* ── Writing / Speaking: scrollable ── */
    #section-writing  { overflow-y: auto; }
    #section-speaking { overflow-y: auto; }
  </style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <a href="index.html" style="color:rgba(255,255,255,.7);font-size:.85rem">← Tests</a>
  <h1 id="test-title">Test 1</h1>
  <div class="section-tabs" id="section-tabs">
    <button class="tab active" data-section="listening">🎧 Listening</button>
    <button class="tab" data-section="reading">📖 Reading</button>
    <button class="tab" data-section="writing">✍️ Writing</button>
    <button class="tab" data-section="speaking">🗣️ Speaking</button>
  </div>
  <div class="spacer"></div>
  <div class="timer" id="timer">--:--</div>
</header>

<div id="main-content">

  <!-- ── LISTENING ── -->
  <div id="section-listening" class="section active listening-layout">
    <div class="part-tabs" id="part-tabs"></div>
    <div class="audio-bar" id="audio-bar">
      <audio id="audio-player" controls preload="none"></audio>
      <button class="btn btn-accent btn-sm" id="transcript-toggle">📄 Transcript</button>
    </div>
    <div class="transcript-panel" id="transcript-panel"></div>
    <div class="listening-questions">
      <div class="question-area" id="listen-q-area"></div>
    </div>
  </div>

  <!-- ── READING ── -->
  <div id="section-reading" class="section">
    <!-- Passage navigator bar -->
    <div class="read-q-nav-sticky">
      <div class="q-nav" id="read-q-nav"></div>
    </div>
    <!-- Split: passage (left) | all questions (right) -->
    <div class="read-split">
      <div class="read-passage-block" id="passage-panel"></div>
      <div class="read-q-block" id="read-q-area"></div>
    </div>
  </div>

  <!-- ── WRITING ── -->
  <div id="section-writing" class="section">
    <div class="writing-section" id="writing-content"></div>
  </div>

  <!-- ── SPEAKING ── -->
  <div id="section-speaking" class="section">
    <div class="speaking-section" id="speaking-content"></div>
  </div>

</div>

<!-- Footer -->
<div class="footer-nav">
  <button class="btn btn-outline" id="btn-prev">← Prev</button>
  <span id="q-position" class="text-muted" style="font-size:.82rem"></span>
  <div class="spacer"></div>
  <button class="btn btn-outline" id="btn-next">Next →</button>
  <button class="btn btn-success" id="btn-submit">Submit Test</button>
</div>

<script src="data/tests.js"></script>
<script src="data/answers.js"></script>
<script src="data/tapescripts.js"></script>
<script src="app.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────────
const testNum   = APP.getTestNum();
const test      = TESTS[testNum];
let userAnswers = APP.getAnswers(testNum);

let currentSection = 'listening';
let listenIndex    = 0;   // index into flatListening
let readIndex      = 0;   // index into flatReading
let currentPart    = 0;   // 0-based part index for listening display

const flatL = APP.flatListening(test);
const flatR = APP.flatReading(test);

// ── Timer ──────────────────────────────────────────────────────────────────
const SECTION_TIMES = { listening: 40*60, reading: 60*60, writing: 60*60, speaking: 0 };
let timerSeconds = 0;
let timerInterval = null;

function startTimer(section) {
  clearInterval(timerInterval);
  timerSeconds = SECTION_TIMES[section] || 0;
  updateTimerDisplay();
  if (!timerSeconds) { document.getElementById('timer').textContent = '—'; return; }
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) clearInterval(timerInterval);
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer');
  el.textContent = APP.formatTime(timerSeconds);
  el.className = 'timer' + (timerSeconds < 120 ? ' danger' : timerSeconds < 300 ? ' warning' : '');
}

// ── Section Switching ──────────────────────────────────────────────────────
document.getElementById('section-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  switchSection(tab.dataset.section);
});

function switchSection(name) {
  currentSection = name;
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(`section-${name}`).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.section === name));
  startTimer(name);
  if (name === 'listening') renderListening();
  if (name === 'reading')   renderReading();
  if (name === 'writing')   renderWriting();
  if (name === 'speaking')  renderSpeaking();
  updateFooter();
}

// ── LISTENING ─────────────────────────────────────────────────────────────
function renderListening() {
  if (!flatL.length) {
    document.getElementById('listen-q-area').innerHTML = '<p class="text-muted p-1">No listening section for this test.</p>';
    return;
  }

  const parts = test.listening.parts;

  // Part tabs
  document.getElementById('part-tabs').innerHTML = parts.map((p, i) =>
    `<button class="part-tab ${i===currentPart?'active':''}" data-pi="${i}">Part ${p.part}</button>`
  ).join('');

  // Audio
  const partNum = parts[currentPart]?.part;
  const audio   = document.getElementById('audio-player');
  if (test.hasAudio) {
    audio.src = APP.audioSrc(testNum, partNum);
    document.getElementById('audio-bar').style.display = 'flex';
  } else {
    document.getElementById('audio-bar').style.display = 'none';
  }

  // Transcript
  const ts = TAPESCRIPTS[testNum]?.[`part${partNum}`] || '';
  const tp = document.getElementById('transcript-panel');
  tp.innerHTML = ts
    ? ts.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')
    : '<em>No transcript available.</em>';

  renderAllListenQuestions();
  updateFooter();
}

function renderAllListenQuestions() {
  const partQs = flatL.filter(item => item.partIndex === currentPart);
  const area   = document.getElementById('listen-q-area');

  area.innerHTML = partQs.map(item => {
    const saved = userAnswers.listening[item.q.id] || '';
    return `<div class="listen-q-block" id="lq-${item.q.id}">
      <div class="q-label">Question ${item.q.id} of ${flatL.length}</div>
      <p class="q-text">${item.q.text}</p>
      <div class="options">${APP.renderOptions(item.q, saved)}</div>
    </div>`;
  }).join('');

  // Event delegation — one listener on the container
  area.addEventListener('click', handleListenClick);
}

function handleListenClick(e) {
  const lbl = e.target.closest('.option-label');
  if (!lbl) return;
  const block = lbl.closest('.listen-q-block');
  if (!block) return;
  const qid  = parseInt(block.id.replace('lq-', ''));
  const val  = lbl.dataset.key;
  userAnswers.listening = userAnswers.listening || {};
  userAnswers.listening[qid] = val;
  APP.saveAnswers(testNum, userAnswers);
  // Re-render only the options in this block
  const item = flatL.find(i => i.q.id === qid);
  block.querySelector('.options').innerHTML = APP.renderOptions(item.q, val);
  updateFooter();
}

document.getElementById('part-tabs').addEventListener('click', e => {
  const btn = e.target.closest('.part-tab');
  if (!btn) return;
  currentPart = parseInt(btn.dataset.pi);
  renderListening();
});

document.getElementById('transcript-toggle').addEventListener('click', () => {
  document.getElementById('transcript-panel').classList.toggle('open');
});

// ── READING ───────────────────────────────────────────────────────────────
// readIndex = index of current PASSAGE (not question)
let currentPassage = 0;

function renderReading() {
  if (!flatR.length) {
    document.getElementById('read-q-area').innerHTML = '<p class="text-muted p-1">No reading section.</p>';
    return;
  }
  renderPassageNav();
  renderPassage();
  renderAllReadQuestions();
  updateFooter();
}

function renderPassage() {
  const passage = test.reading.passages[currentPassage];
  if (!passage) return;
  const passageHtml = passage.text
    .replace(/\n\n+/g, '\x00')
    .replace(/\n/g, ' ')
    .replace(/\*\*(.+?)\*\*/g, '<strong style="background:rgba(255,230,0,.35);border-radius:2px;padding:0 2px">$1</strong>')
    .replace(/\x00/g, '</p><p>');
  document.getElementById('passage-panel').innerHTML =
    `<h3>Passage ${currentPassage + 1}</h3><p>${passageHtml}</p>`;
  document.getElementById('passage-panel').scrollTop = 0;
}

function renderPassageNav() {
  const passages = test.reading.passages;
  document.getElementById('read-q-nav').innerHTML = passages.map((p, i) => {
    const qs       = p.questions || [];
    const answered = qs.filter(q => userAnswers.reading[q.id]).length;
    const active   = i === currentPassage ? 'active' : '';
    const done     = answered === qs.length ? 'answered' : '';
    return `<button class="q-btn ${active} ${done}" onclick="jumpPassage(${i})">
      P${i + 1} <span style="font-size:.7rem;opacity:.75">${answered}/${qs.length}</span>
    </button>`;
  }).join('');
}

function renderAllReadQuestions() {
  const passage = test.reading.passages[currentPassage];
  if (!passage) return;
  const area = document.getElementById('read-q-area');

  area.innerHTML = passage.questions.map(q => {
    const saved   = userAnswers.reading[q.id] || '';
    const hasOpts = Object.values(q.options || {}).some(v => v.trim());
    const qHtml   = q.text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    const answerBlock = hasOpts
      ? `<div class="options">${APP.renderOptions(q, saved)}</div>`
      : `<input type="text" class="read-short-input" data-qid="${q.id}"
           value="${saved.replace(/"/g,'&quot;')}" placeholder="Type your answer…"
           style="width:100%;padding:.5rem .7rem;font-size:.9rem;border:2px solid var(--border);
                  border-radius:8px;background:var(--card);color:var(--text);box-sizing:border-box;margin-top:.4rem">`;
    return `<div class="read-q-item" id="rq-${q.id}">
      <div class="q-label">Question ${q.id} of ${flatR.length}</div>
      <p class="q-text">${qHtml}</p>
      ${answerBlock}
    </div>`;
  }).join('');

  // Event delegation for MCQ clicks
  area.addEventListener('click', handleReadClick);

  // Short-answer inputs
  area.querySelectorAll('.read-short-input').forEach(inp => {
    inp.addEventListener('input', () => {
      userAnswers.reading[parseInt(inp.dataset.qid)] = inp.value;
      APP.saveAnswers(testNum, userAnswers);
      renderPassageNav();
      updateFooter();
    });
  });
  area.scrollTop = 0;
}

function handleReadClick(e) {
  const lbl = e.target.closest('.option-label');
  if (!lbl) return;
  const block = lbl.closest('.read-q-item');
  if (!block) return;
  const qid = parseInt(block.id.replace('rq-', ''));
  const val = lbl.dataset.key;
  userAnswers.reading[qid] = val;
  APP.saveAnswers(testNum, userAnswers);
  const q = flatR.find(i => i.q.id === qid)?.q;
  block.querySelector('.options').innerHTML = APP.renderOptions(q, val);
  renderPassageNav();
  updateFooter();
}

function jumpPassage(idx) {
  currentPassage = idx;
  renderPassageNav();
  renderPassage();
  renderAllReadQuestions();
  updateFooter();
}

// ── WRITING ───────────────────────────────────────────────────────────────
function renderWriting() {
  const w = test.writing;
  if (!w) { document.getElementById('writing-content').innerHTML = '<p class="text-muted">No writing section.</p>'; return; }

  let html = '';
  for (const [key, task] of Object.entries(w)) {
    const taskNum = key.replace('task', '');
    const saved   = userAnswers.writing?.[key] || '';
    const bullets = task.bullets?.map(b => `<li>${b}</li>`).join('') || '';
    html += `
      <div style="margin-bottom:2rem">
        <div class="task-prompt">
          <h3>Task ${taskNum} ${taskNum==='1'?'(~20 min, 120+ words)':'(~40 min, 250+ words)'}</h3>
          <p style="font-size:.9rem;line-height:1.65;margin-top:.4rem">${task.prompt}</p>
          ${bullets ? `<ul style="margin-top:.5rem">${bullets}</ul>` : ''}
        </div>
        <textarea id="writing-${key}" placeholder="Write your answer here..."
          oninput="saveWriting('${key}',this.value)">${saved}</textarea>
        <div class="word-count" id="wc-${key}">Words: ${APP.countWords(saved)}</div>
      </div>`;
  }
  document.getElementById('writing-content').innerHTML = html;
}

function saveWriting(key, val) {
  userAnswers.writing = userAnswers.writing || {};
  userAnswers.writing[key] = val;
  APP.saveAnswers(testNum, userAnswers);
  const wc = document.getElementById(`wc-${key}`);
  if (wc) wc.textContent = `Words: ${APP.countWords(val)}`;
}

// ── SPEAKING ──────────────────────────────────────────────────────────────
function renderSpeaking() {
  const sp = test.speaking;
  if (!sp) { document.getElementById('speaking-content').innerHTML = '<p class="text-muted">No speaking section.</p>'; return; }

  const partNames = { part1: 'Social Interaction', part2: 'Solution Discussion', part3: 'Topic' };
  let html = '';

  for (const [key, part] of Object.entries(sp)) {
    const qs = part.questions?.map(q => `<li>${q}</li>`).join('') || '';
    html += `
      <div class="speaking-card">
        <h3>Part ${key.replace('part','')}: ${partNames[key] || part.title}</h3>
        <div style="font-size:.85rem;color:var(--muted);margin:.3rem 0">Topic: <strong>${part.topic}</strong></div>
        ${qs ? `<ol style="margin:.75rem 0 0 1.2rem;line-height:1.8;font-size:.9rem">${qs}</ol>` : ''}
      </div>`;
  }

  document.getElementById('speaking-content').innerHTML = html;
}

// ── Navigation ────────────────────────────────────────────────────────────
function updateFooter() {
  const pos  = document.getElementById('q-position');
  const prev = document.getElementById('btn-prev');
  const next = document.getElementById('btn-next');

  if (currentSection === 'listening') {
    const partQs    = flatL.filter(i => i.partIndex === currentPart);
    const answered  = partQs.filter(i => userAnswers.listening[i.q.id]).length;
    pos.textContent = `Part ${currentPart + 1} · ${answered}/${partQs.length} answered`;
    prev.disabled   = currentPart === 0;
    next.disabled   = currentPart >= (test.listening?.parts?.length ?? 1) - 1;
  } else if (currentSection === 'reading') {
    const totalPassages = test.reading?.passages?.length ?? 0;
    const pQs     = test.reading?.passages[currentPassage]?.questions || [];
    const answered = pQs.filter(q => userAnswers.reading[q.id]).length;
    pos.textContent = `Passage ${currentPassage + 1}/${totalPassages} · ${answered}/${pQs.length} answered`;
    prev.disabled   = currentPassage === 0;
    next.disabled   = currentPassage >= totalPassages - 1;
  } else {
    pos.textContent = '';
    prev.disabled   = true;
    next.disabled   = true;
  }
}

document.getElementById('btn-prev').addEventListener('click', () => {
  if (currentSection === 'listening' && currentPart > 0) {
    currentPart--;
    renderListening();
  } else if (currentSection === 'reading' && currentPassage > 0) {
    jumpPassage(currentPassage - 1);
  }
  updateFooter();
});

document.getElementById('btn-next').addEventListener('click', () => {
  if (currentSection === 'listening' && currentPart < (test.listening?.parts?.length ?? 1) - 1) {
    currentPart++;
    renderListening();
  } else if (currentSection === 'reading' && currentPassage < (test.reading?.passages?.length ?? 1) - 1) {
    jumpPassage(currentPassage + 1);
  }
  updateFooter();
});

// ── Submit ─────────────────────────────────────────────────────────────────
document.getElementById('btn-submit').addEventListener('click', () => {
  const answered = Object.keys(userAnswers.listening||{}).length + Object.keys(userAnswers.reading||{}).length;
  const total    = flatL.length + flatR.length;
  if (answered < total) {
    if (!confirm(`You have answered ${answered}/${total} questions. Submit anyway?`)) return;
  }
  APP.saveAnswers(testNum, userAnswers);
  location.href = `review.html?test=${testNum}`;
});

// ── Init ──────────────────────────────────────────────────────────────────
document.getElementById('test-title').textContent = `Test ${testNum}`;
if (!test.listening) {
  document.querySelector('[data-section="listening"]').classList.add('hidden');
  switchSection('reading');
} else {
  renderListening();
  startTimer('listening');
}
updateFooter();
</script>
</body>
</html>
